name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Hızlı geri bildirim: veritabanı gerektirmeyen her şey.
  # ---------------------------------------------------------------------------
  kalite:
    name: Lint, typecheck, birim testleri, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # postinstall zaten `prisma generate` çalıştırıyor.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Birim testleri saf fonksiyonları, handler testleri de rotaları
      # kapsıyor; ikisi de Prisma'yı taklit ediyor, veritabanı istemiyor.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build sırasında gerçek servise bağlanılmıyor; env doğrulaması için
          # sözdizimsel olarak geçerli placeholder değerler yeterli.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXTAUTH_SECRET: ci-placeholder-secret
          OPENROUTER_API_KEY: ci-placeholder-key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-key

  # ---------------------------------------------------------------------------
  # Uçtan uca: gerçek PostgreSQL + gerçek Next.js sunucusu.
  #
  # Ayrı bir iş çünkü yavaş ve dış bağımlılığı var. `kalite` işi geçmeden
  # başlamıyor: kırık bir build'i e2e ile aramak zaman kaybı.
  # ---------------------------------------------------------------------------
  e2e:
    name: Uçtan uca testler
    runs-on: ubuntu-latest
    needs: kalite
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: trip
          POSTGRES_DB: trip_planner_test
        ports:
          - 5432:5432
        # Sunucu hazır olmadan migration çalıştırmak yarış demek.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trip:trip@localhost:5432/trip_planner_test
      NEXTAUTH_SECRET: e2e-ci-secret
      OPENROUTER_API_KEY: e2e-placeholder
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: e2e-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Playwright tarayıcıları npm paketiyle GELMİYOR; ayrıca indiriliyor.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `migrate deploy` (dev değil): mevcut migration'ları uygular, yeni
      # migration üretmez. CI'da şema sürüklenmesi bir hata olmalı.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: E2E
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
