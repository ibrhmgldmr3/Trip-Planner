name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # postinstall zaten `prisma generate` çalıştırıyor.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Birim testler saf fonksiyonları kapsıyor; veritabanı ya da ağ istemiyor.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build sırasında gerçek servise bağlanılmıyor; env doğrulaması için
          # sözdizimsel olarak geçerli placeholder değerler yeterli.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXTAUTH_SECRET: ci-placeholder-secret
          OPENROUTER_API_KEY: ci-placeholder-key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-key
